[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sharepoint-digest"
version = "0.1.0"
description = "Summarize the PowerPoint and Word files in a SharePoint folder into a digest with a GPT model in Azure AI Foundry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19",
    "openai>=3,<4",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "requests>=2.32",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sharepoint-digest = "sharepoint_digest.cli:main"

[tool.setuptools]
packages = ["sharepoint_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
