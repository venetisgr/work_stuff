# news-dip-scanner: lint and test every pull request and push that touches it, and deploy it to Fly.io after a push to
# the repository's default branch, or by hand (Actions > news-dip-scanner > Run workflow, for the branch you pick).
# Deploying needs the FLY_API_TOKEN repository secret (`fly tokens create deploy`); without it the deploy job only
# says so. See news-dip-scanner/docs/DEPLOY.md.
name: news-dip-scanner

on:
  pull_request:
    paths:
      - "news-dip-scanner/**"
      - ".github/workflows/news-dip-scanner.yml"
  push:
    paths:
      - "news-dip-scanner/**"
      - ".github/workflows/news-dip-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on a branch otherwise wait their turn, so a deploy is
# never cut off halfway.
concurrency:
  group: news-dip-scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: news-dip-scanner
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-dip-scanner/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Fly.io
    needs: test
    # Only from the default branch (whatever it is called), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: news-dip-scanner-fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: No Fly.io token
        if: env.FLY_API_TOKEN == ''
        run: >-
          echo "::notice title=Not deployed::Add the FLY_API_TOKEN repository secret to deploy to Fly.io
          (news-dip-scanner/docs/DEPLOY.md)."
      - uses: actions/checkout@v7
        if: env.FLY_API_TOKEN != ''
        with:
          persist-credentials: false
      # Fly's own action (the docs use @master), pinned to master's commit on 2026-09-28 since this job holds the token.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: env.FLY_API_TOKEN != ''
      - name: fly deploy
        if: env.FLY_API_TOKEN != ''
        working-directory: news-dip-scanner
        # --ha=false: never a second Machine, even if the app was scaled to zero (one scanner, one SQLite volume).
        run: flyctl deploy --remote-only --ha=false
