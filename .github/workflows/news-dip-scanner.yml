# news-dip-scanner: lint and test every pull request and every push that touches the project, and deploy the Python
# app to Fly.io after a push to main that changed what goes into its image, or by hand (Actions > news-dip-scanner >
# Run workflow, on main; on another branch it only tests). A change to the Next.js front end
# (news-dip-scanner/frontend/) runs its own checks; Vercel deploys it, so a change to it alone never restarts the
# scanner on Fly.io, and neither do changes to the docs or the tests alone. A change to the API contract
# (frontend/contract/) runs both checks, since the Python tests check the API against it. The "Checks" job always
# runs and passes when every check that was needed passed: it is the one to require on main. Deploying needs the
# FLY_API_TOKEN repository secret (`fly tokens create deploy`); without it the deploy job only says so. See
# news-dip-scanner/docs/DEPLOY.md and docs/VERCEL.md.
name: news-dip-scanner

on:
  # Every pull request, whatever it touches: a workflow skipped by a paths filter leaves a required check waiting for
  # ever. The jobs a change doesn't concern are skipped instead (see "What changed"), which counts as passed.
  pull_request:
  push:
    paths:
      - "news-dip-scanner/**"
      - ".github/workflows/news-dip-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

# Runs on a branch wait their turn in the order they were pushed: queue: max keeps every pending run. (By default
# GitHub cancels all but the newest pending run, and that run's "What changed" would miss the cancelled pushes' files
# and skip a Fly deploy.) queue: max can't be combined with cancel-in-progress, so an outdated pull-request run also
# finishes; a deploy is never cut off halfway.
concurrency:
  group: news-dip-scanner-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      python: ${{ steps.diff.outputs.python }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # app: what goes into the Fly image (deployed): the Dockerfile and .dockerignore, pyproject.toml, README.md
      # (pyproject.toml's readme), dip_scanner/, scanner.toml, feeds.toml, and fly.toml; python: the Python checks'
      # inputs, everything outside frontend/ (docs and tests too) and the API contract; frontend: the Next.js app. A
      # workflow change, a run by hand, a new branch or an unknown base checks and deploys everything.
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null; then
            files=".github/workflows/news-dip-scanner.yml"
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          workflow=$(has '^\.github/workflows/news-dip-scanner\.yml$')
          outside=$(printf '%s\n' "$files" | grep '^news-dip-scanner/' | grep -v '^news-dip-scanner/frontend/' || true)
          image=$(has '^news-dip-scanner/(Dockerfile|\.dockerignore|pyproject\.toml|README\.md|scanner\.toml|feeds\.toml|fly\.toml|dip_scanner/)')
          app=$([ "$image" = true ] || [ "$workflow" = true ] && echo true || echo false)
          contract=$(has '^news-dip-scanner/frontend/contract/')
          python=$([ -n "$outside" ] || [ "$workflow" = true ] || [ "$contract" = true ] && echo true || echo false)
          frontend=$([ "$(has '^news-dip-scanner/frontend/')" = true ] || [ "$workflow" = true ] && echo true || echo false)
          echo "app=$app python=$python frontend=$frontend"
          {
            echo "app=$app"
            echo "python=$python"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: news-dip-scanner
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-dip-scanner/pyproject.toml
      # dev brings pytest, ruff, jsonschema (the API's answers are checked against frontend/contract) and the SDKs
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Front end (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: news-dip-scanner/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: news-dip-scanner/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # The check to require on main (branch protection): it always runs, and fails unless every job before it passed or
  # was skipped because the change didn't concern it. A failed "What changed" fails it too (it would otherwise skip
  # every check, which counts as passed).
  checks:
    name: Checks
    needs: [changes, test, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every needed check passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do case "$result" in success|skipped) ;; *) exit 1 ;; esac; done

  deploy:
    name: Deploy to Fly.io
    needs: [changes, test]
    # Only main is deployed: after a push to it that changed the Fly image's inputs, or when started by hand on it.
    # Vercel's production branch is main too, so the front end and the API it calls go out from the same commits.
    if: >-
      github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: news-dip-scanner-fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: No Fly.io token
        if: env.FLY_API_TOKEN == ''
        run: >-
          echo "::notice title=Not deployed::Add the FLY_API_TOKEN repository secret to deploy to Fly.io
          (news-dip-scanner/docs/DEPLOY.md)."
      - uses: actions/checkout@v7
        if: env.FLY_API_TOKEN != ''
        with:
          persist-credentials: false
      # Fly's own action (the docs use @master), pinned to master's commit on 2026-09-28 since this job holds the token.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: env.FLY_API_TOKEN != ''
      - name: fly deploy
        if: env.FLY_API_TOKEN != ''
        working-directory: news-dip-scanner
        # --ha=false: never a second Machine, even if the app was scaled to zero (one scanner, one SQLite volume).
        run: flyctl deploy --remote-only --ha=false
