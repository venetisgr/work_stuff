# SEC EDGAR latest 8-K filings (material events: results, guidance, exec departures, delisting notices, ...).
# sec.gov requires a User-Agent with contact details: set SEC_USER_AGENT in .env, e.g. "Jane Doe jane@example.com".
# A generic User-Agent gets 403. Keep requests polite; SEC allows at most 10 per second.
# verified 2026-09-27 (with a contact User-Agent): 100 items, newest 43 h old (no filings at weekends),
# all with summaries (form items), no ETag/Last-Modified
[feeds.sec-8k-filings]
name = "SEC EDGAR - Latest 8-K Filings"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=100&output=atom"
category = "filings"
enabled = true
dedup_titles = false  # "8-K - APPLE INC (0000320193) (Filer)" is the title of every Apple 8-K

# PR Newswire, all news releases: company announcements straight from the source.
