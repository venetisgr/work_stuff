# Google News search for stories about falling shares, from any outlet, last 24 hours. The most direct "dip"
# signal in this list; it is noisy (rallies and non-finance "stock report" stories slip in) and triage filters that.
# verified 2026-09-27: 34 items, newest 38 min old, summaries (headline + source), no ETag/Last-Modified
[feeds.google-news-stock-drops]
name = "Google News - Shares Falling"
url = "https://news.google.com/rss/search?q=%22shares+fell%22+OR+%22stock+drops%22+OR+%22shares+tumble%22+when:1d&hl=en-US&gl=US&ceid=US:en"
category = "markets"
enabled = true

# Reuters business stories through Google News (Reuters closed its own RSS feeds in 2020).
# verified 2026-09-27: 100 items, newest 24 min old, summaries (headline + source), no ETag/Last-Modified
