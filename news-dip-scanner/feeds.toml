# News sources the scanner polls. List them and test them with: dip-scanner feeds --check
#
# Each [feeds.<key>] table is one RSS or Atom feed; <key> is its short id (lowercase, dashes) and is stored
# with every article it produces, so keep it stable once the scanner has run.
#   name     - label shown in reports and in the news digest
#   url      - the feed URL (free, no login)
#   category - label for reports: markets, earnings, filings, press-releases, tech, energy, health, macro,
#              europe or greece
#   enabled  - set to false to keep a feed listed without polling it (default true)
#   dedup_titles - false for feeds whose headlines are formulaic and repeat for different items (SEC filings);
#              otherwise a headline seen again within 72 hours, from any feed, is the same story (default true)
#   languages - items tagged with another language are dropped (default ["en"]; [] keeps every language). PR
#              Newswire and GlobeNewswire publish machine translations of each release; only feeds that tag each
#              item with its language are affected
#
# The scanner polls every enabled feed each cycle (every ~5 minutes in watch mode) with conditional requests,
# so feeds that send ETag or Last-Modified cost almost nothing when nothing changed. The same story in several
# feeds is kept once (articles are matched by link and by normalised title), and translated copies are dropped.
#
# Every feed below was checked from a cloud server on Sunday 2026-09-27 with the scanner's User-Agent.
# "newest" is the age of the newest item at that moment, so weekend ages are longer than weekday ones.
# The 20 enabled feeds cover US markets, earnings, SEC 8-K filings, company press releases, tech and
# semiconductors, energy, pharma/biotech, macro and Europe. Verified alternates and the Greek sources are listed
# further down with enabled = false; feeds that were checked and rejected are listed at the end of the file.

# ---------------------------------------------------------------------------------------------------------------
# Markets
# ---------------------------------------------------------------------------------------------------------------

# MarketWatch top stories: market-moving headlines with a one-line summary.
# verified 2026-09-27: 10 items, newest 13 min old, all with summaries, ETag (re-fetch -> 304)
[feeds.marketwatch-top-stories]
name = "MarketWatch - Top Stories"
url = "https://feeds.content.dowjones.io/public/rss/mw_topstories"
category = "markets"
enabled = true

# WSJ US business: company scoops (strategy, deals, management, lawsuits). Headlines and summaries are free.
# The old feeds.a.dj.com URLs still answer but stopped updating in early 2025; use feeds.content.dowjones.io.
# verified 2026-09-27: 85 items, newest 6 min old, 82 with summaries, ETag (re-fetch -> 304)
[feeds.wsj-us-business]
name = "WSJ - US Business"
url = "https://feeds.content.dowjones.io/public/rss/WSJcomUSBusiness"
category = "markets"
enabled = true

