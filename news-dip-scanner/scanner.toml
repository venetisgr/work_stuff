# news-dip-scanner thresholds and watchlist.
#
# Every setting is optional: delete a line (or this whole file) and the default shown here applies. A misspelled
# setting is an error, never silently ignored. Point to another copy with --config or SCANNER_CONFIG.

[scan]
# Minutes between cycles in `dip-scanner watch` (cycles start on the boundaries: :00, :05, :10, ...).
interval_minutes = 5
# New articles older than this are stored but never sent to the model. This is what keeps the first cycle after
# a fresh install from triaging days of backlog: it only triages the last day (a few hundred articles). Articles
# left pending by an unavailable model are retired once they are this old, too.
max_article_age_hours = 24
# How far back company news counts towards a candidate (a dip can follow the news by a day or two).
lookback_hours = 48
# Articles per triage request, and how often an article is retried when the model's reply is unusable.
triage_batch_size = 20
max_triage_attempts = 3
# At most this many fear-vs-fundamentals analyses per cycle (bounds the LLM bill); the rest are named in the
# report's notes and wait for the next cycle.
max_candidates_per_cycle = 8
# A ticker isn't re-analysed within this many hours unless qualifying news arrives that the last analysis didn't
# see, or that analysis came before any trading on its news (weekend news) and the next session has moved.
cooldown_hours = 24
# Until a new session has traded since a ticker's last analysis (news in the evening, at the weekend with the price
# frozen at the last close, or later the same day), new news re-analyses it at most once in this many hours; the rest
# waits for the next session or that time, and is named in the notes. The same news on the same prices is never
# analysed twice. A further fall of [dip] min_drop_1d_pct during the session lifts the wait. 0 turns this off.
reanalyse_same_session_hours = 12
# At most this many analyses in any 24 hours, all tickers together (analyses the model answered, `dip-scanner
# analyze` included). Candidates over the limit are named in the notes and analysed once there is room. 0 = no limit.
max_analyses_per_day = 40
# Fetch per-ticker headlines (Yahoo Finance + Google News) to give the analysis more context.
context_news = true
# Feeds fetched in parallel.
workers = 8
# Articles older than this many days are deleted (opportunities are kept forever for `dip-scanner track`).
retention_days = 30

[dip]
# What counts as a dip: any one of these is enough. Percentages, written as positive numbers.
min_drop_1d_pct = 3.0          # down at least 3% on the day (vs the previous close)
min_drop_5d_pct = 6.0          # down at least 6% over 5 sessions
min_drawdown_20d_pct = 10.0    # at least 10% below the 20-session high
# Which news can make a company a candidate: impact 1 (negligible) to 5 (major), its direction, and whether news
# that affects a company only indirectly (a supplier, customer or competitor) counts.
min_magnitude = 2
directions = ["negative", "mixed"]
include_indirect = true

[universe]
# Watchlist tickers (Yahoo Finance symbols; "BRK.B" or "NASDAQ:TSLA" are written the Yahoo way) skip the
# magnitude and relation filters: any negative or mixed news of magnitude 1 or more, direct or indirect. They still
# need a dip, and [dip] directions still applies.
watchlist = []
# watchlist = ["AMD", "NVDA", "ASML", "MSFT", "TSM"]
# Athens: see "Scanning Athens stocks" in the README for current codes, e.g. ["ETE.AT", "PPC.AT", "ALWN.AT"].
# Only ever consider the watchlist.
only_watchlist = false
# Never consider these tickers.
exclude = []
# Skip penny stocks below this price, in the currency's main unit (London quotes in pence, Johannesburg in cents
# and Tel Aviv in agorot are divided by 100 first).
min_price = 1.0
# Only these exchanges, by Yahoo suffix: "" is US (AMD), ".DE" Xetra, ".PA" Paris, ".AS" Amsterdam, ".L" London,
# ".AT" Athens, ".T" Tokyo, ".HK" Hong Kong... Leave it commented out to allow every exchange.
# allowed_suffixes = ["", ".DE", ".PA", ".AS", ".AT"]
# The listing you buy for a company listed in several places. The triage names the one the article is about, often
# the US one; with a euro account the euro listing saves the currency conversion and its fee. News filed under a key
# goes to its value, and watchlist and exclude entries are read the same way. Mind allowed_suffixes.
preferred_listings = {}
# preferred_listings = { "ASML" = "ASML.AS", "SAP" = "SAP.DE", "TTE" = "TTE.PA", "STLA" = "STLAM.MI" }

[alerts]
# Which new opportunities are sent as notifications (all of them are in the reports).
# In practice min_score is the rule that binds. The potential low sits near the statistical 6-month low and the
# target near the pre-drop high, so the score's reward_risk (upside / (upside + downside)) is usually 0.2-0.4, and a
# score of 65 then needs a chance up of about 76-85% for "temporary fear" at high confidence (more at medium). A
# "mixed" verdict needs 93% or more at high confidence, above the 90% the model is told not to exceed, so mixed
# alerts effectively need a lower min_score (55 lets mixed/high at 80% alert, and the README's scoring example at
# 58.5). min_probability only matters when the upside is over about 3.5 times the downside.
# Listings outside the US have no SEC fundamentals. The model is told that this is expected and not to lower its
# confidence for it: a "low" confidence scales the score by 0.85, which would keep them under 65 almost always.
min_score = 65
min_probability = 60
verdicts = ["temporary_fear", "mixed"]
# A ticker alerted within repeat_hours isn't alerted again unless the score rose by at least min_score_change, the
# verdict changed or the price fell by another [dip] min_drop_1d_pct (a developing story is analysed again as new
# articles arrive, but sent once). A new analysis that undercuts an alert from the last 6 months (no longer passes
# these rules, or 20 or more points less likely to be higher) is sent as a "thesis change".
repeat_hours = 24
min_score_change = 10
# System notices to the same channels, so an unattended scanner doesn't fail silently: "dip-scanner stopped" when
# `run` or `watch` stops on a setup problem (a rejected key, no credit, a broken setting), and a notice when the model
# has been unavailable, or every feed has failed, for notice_after_cycles cycles in a row (6 = half an hour at the
# 5-minute interval). Each kind at most once every 12 hours; secrets are never included.
system_notices = true
notice_after_cycles = 6

[account]
# The currency of your broker account (ISO code). When set, reports and alerts show price, entry and target in it
# too ("$132.00 ≈ €115.93") for stocks that trade in another currency, at Yahoo Finance's rate at the analysis, and
# `dip-scanner track` shows returns in it next to the local ones, exchange-rate moves included. Unset: no conversion.
# currency = "EUR"
