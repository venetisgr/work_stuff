[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-mapreduce"
version = "0.1.0"
description = "LangChain-style map-reduce over pandas and PySpark DataFrames with Azure OpenAI: Batch API first, then async, then a plain loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19",
    "openai>=3,<4",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "pyspark>=3.5"]

[tool.setuptools]
packages = ["azure_mapreduce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
